name: Publish site via GitHub Pages

# Builds the MkDocs site from docs/ and the slide deck from slides/, then
# publishes both to the gh-pages branch, which is what GitHub Pages serves for
# sasjs.io.
#
# The toolchain is pinned in requirements.txt, and the deck builder in this file,
# so the versions that render the site are reviewable in the repository.

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the docs toolchain
        run: pip install -r requirements.txt

      - name: Build the site
        # --strict fails the run on a broken page link or anchor, so a dead link
        # cannot be deployed.
        run: mkdocs build --strict

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build the slide deck
        # The 6-minute overview lives at /slides/appdev.html and is built from
        # the markdown rather than committed, so the deck cannot drift from its
        # source. marp renders through a headless browser, hence --no-sandbox on
        # a runner.
        run: |
          mkdir -p site/slides
          npx --yes @marp-team/marp-cli@3.4.0 slides/slides6min.md \
            -o site/slides/appdev.html --no-sandbox

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          cname: sasjs.io
