# Hooks for the pre-commit framework - https://pre-commit.com
#
# Install the framework once with `pre-commit install`, and the secret scan runs
# on every commit. The hook is pinned to an exact gitleaks release tag.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
